<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle gradient based on pine green and citron accent -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f5c4a" />
      <stop offset="100%" stop-color="#0a4436" />
    </linearGradient>

    <!-- Shield outline gradient -->
    <linearGradient id="shieldGrad" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dfeee7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6fd3b0" stop-opacity="0.4" />
    </linearGradient>

    <!-- Iris aperture contour gradient using citron accent -->
    <linearGradient id="irisGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4e157" />
      <stop offset="60%" stop-color="#dfeee7" />
      <stop offset="100%" stop-color="#6fd3b0" />
    </linearGradient>

    <!-- Central pupil focal glow -->
    <radialGradient id="pupilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4e157" />
      <stop offset="60%" stop-color="#0f5c4a" />
      <stop offset="100%" stop-color="#0a4436" />
    </radialGradient>
  </defs>

  <!-- Container Base with smooth rounded corner -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Protective Shield (Compliance / Risk Defence) -->
  <path
    d="M32 10L14 18V30C14 42.5 21.7 51.5 32 54C42.3 51.5 50 42.5 50 30V18L32 10Z"
    stroke="url(#shieldGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#0a4436"
    fill-opacity="0.6"
  />

  <!-- Iris Eye Contour (Screening / Aperture / Vision) -->
  <path
    d="M19 32C22.5 24 27.5 20.5 32 20.5C36.5 20.5 41.5 24 45 32C41.5 40 36.5 43.5 32 43.5C27.5 43.5 22.5 40 19 32Z"
    stroke="url(#irisGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- High-precision Scanner Aperture Ring -->
  <circle
    cx="32"
    cy="32"
    r="7.5"
    stroke="#d4e157"
    stroke-width="1.8"
    stroke-dasharray="4 2.5"
    opacity="0.9"
  />

  <!-- Central Core Pupil (Focused Intelligence) -->
  <circle
    cx="32"
    cy="32"
    r="3.8"
    fill="url(#pupilGrad)"
  />

  <!-- Precision Calibration Dots -->
  <circle cx="32" cy="18.5" r="1.2" fill="#d4e157" />
  <circle cx="32" cy="45.5" r="1.2" fill="#d4e157" />
</svg>
